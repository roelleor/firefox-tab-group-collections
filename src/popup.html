<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Group Collections</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="review.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="popup-title-row">
          <h1>Collections</h1>
          <button class="panel-button" id="open-panel-button" type="button" aria-label="Open side panel" title="Open side panel">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <path d="M9 3v18"></path>
            </svg>
            <span>Side panel</span>
          </button>
        </div>
        <div class="popup-search-control">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input id="popup-search" type="text" placeholder="Search…" aria-label="Search collections or group names" aria-controls="popup-sections" autocomplete="off" spellcheck="false" autofocus>
          <button class="clear-search-button hidden" id="clear-search-button" type="button" aria-label="Clear search" title="Clear search">
            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
              <path d="m18 6-12 12M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </header>
      <section class="popup-error hidden" id="popup-error" aria-live="assertive"></section>
      <section class="popup-empty hidden" id="popup-empty" aria-live="polite"></section>
      <section class="popup-sections" id="popup-sections"></section>
      <footer class="review-footer">
        Finding Collections useful? <a data-review-link href="https://addons.mozilla.org/en-US/firefox/addon/tab-group-collections/reviews/" target="_blank" rel="noopener noreferrer">Leave a review.</a>
      </footer>
    </main>
    <script src="shared.js"></script>
    <script src="ui-theme.js"></script>
    <script src="review-prompt.js"></script>
    <script src="review-ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
